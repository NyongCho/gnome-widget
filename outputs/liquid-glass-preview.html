<div id="liquid-desktop" aria-label="Liquid Glass 바탕화면 위젯 시안">
  <div class="wallpaper"></div>
  <div class="topline"><span>DESKTOP / GLASS STUDY</span><span>시안 · 예시 데이터</span></div>
  <div class="desktop-content">
    <div class="caption"><span>Less noise.<br>More atmosphere.</span><small>날짜, 날씨, 연결.<br>필요한 것만 가볍게.</small></div>
    <div class="widgets">
      <section class="glass calendar" aria-label="날짜와 시계">
        <div class="eyebrow">MONDAY</div><div class="date">2</div><div class="month">2026년 11월</div>
        <div class="clock">09:41 <span>AM</span></div>
      </section>
      <section class="glass weather" aria-label="날씨 예시">
        <div class="location"><i data-lucide="map-pin" aria-hidden="true"></i> 서울 <span>예시</span></div>
        <div class="temperature">14°</div>
        <div class="weather-bottom"><i data-lucide="cloud-sun" aria-hidden="true"></i><span>구름 조금<br><small>최고 17° · 최저 8°</small></span></div>
      </section>
      <section class="glass network" aria-label="네트워크 속도 예시">
        <div class="network-head"><span><i data-lucide="wifi" aria-hidden="true"></i> Network</span><span class="connected">연결됨</span></div>
        <div class="speeds"><div><small>↓ 다운로드</small><strong>24.8 <em>MB/s</em></strong></div><div><small>↑ 업로드</small><strong>1.2 <em>MB/s</em></strong></div></div>
        <svg viewBox="0 0 340 52" preserveAspectRatio="none" role="img" aria-label="예시 네트워크 트래픽 그래프">
          <defs><linearGradient id="glass-chart-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4efff" stop-opacity=".3"/><stop offset="1" stop-color="#c4efff" stop-opacity="0"/></linearGradient></defs>
          <path d="M0 40 L15 39 L25 28 L36 34 L48 30 L61 34 L74 18 L85 24 L96 19 L108 25 L122 9 L136 18 L148 15 L162 22 L178 17 L192 25 L204 16 L219 20 L233 11 L249 14 L263 5 L279 11 L293 8 L309 17 L324 10 L340 14 L340 52 L0 52 Z" fill="url(#glass-chart-fill)"/>
          <path d="M0 40 L15 39 L25 28 L36 34 L48 30 L61 34 L74 18 L85 24 L96 19 L108 25 L122 9 L136 18 L148 15 L162 22 L178 17 L192 25 L204 16 L219 20 L233 11 L249 14 L263 5 L279 11 L293 8 L309 17 L324 10 L340 14" fill="none" stroke="#c4efff" stroke-width="1.7"/>
          <path d="M0 48 L35 47 L55 49 L79 44 L103 47 L129 45 L155 48 L180 43 L208 46 L230 45 L256 47 L285 43 L310 46 L340 44" fill="none" stroke="#e9d9fd" stroke-opacity=".7" stroke-width="1.2"/>
        </svg>
        <div class="chart-labels"><span>60초 전</span><span>지금</span></div>
      </section>
    </div>
  </div>
</div>
<style>
#liquid-desktop{--glass-alpha:.13;--glass-radius:28px;position:relative;isolation:isolate;overflow:hidden;border-radius:18px;min-height:550px;background:#243e53;color:#fff;font-family:Inter,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
#liquid-desktop *{box-sizing:border-box}
#liquid-desktop .wallpaper{position:absolute;inset:0;z-index:-2;background:radial-gradient(ellipse at 12% 20%,#a4b4aa 0,transparent 40%),radial-gradient(ellipse at 72% 0%,#759aa9 0,transparent 45%),radial-gradient(ellipse at 80% 90%,#172d5f 0,transparent 48%),linear-gradient(145deg,#506d73,#487b8f 48%,#242c56)}
#liquid-desktop .wallpaper:after{content:"";position:absolute;width:120%;height:260px;top:270px;left:-10%;border-radius:50%;transform:rotate(-23deg);background:linear-gradient(180deg,#a7c8c044,#33547677 25%,#12243a99);box-shadow:0 -20px 70px #bdcfbc33,inset 0 2px 15px #d3e9d12b;filter:blur(5px)}
#liquid-desktop .topline{display:flex;justify-content:space-between;gap:15px;padding:25px 28px;color:#e4edf0b8;font-size:11px;letter-spacing:1.3px}
#liquid-desktop .topline span:last-child{letter-spacing:0}
#liquid-desktop .desktop-content{display:flex;align-items:center;justify-content:space-between;padding:34px 32px 65px;gap:32px}
#liquid-desktop .caption{flex:1;align-self:flex-end;padding-bottom:20px}
#liquid-desktop .caption>span{font-size:30px;line-height:1.22;font-weight:400;letter-spacing:-1.3px;color:#f6faf7cf}
#liquid-desktop .caption small{display:block;margin-top:18px;font-size:12px;line-height:1.8;color:#edf5f0a6}
#liquid-desktop .widgets{display:grid;grid-template-columns:1fr 1fr;gap:15px;width:370px;flex-shrink:0}
#liquid-desktop .glass{position:relative;border-radius:var(--glass-radius);padding:21px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,calc(var(--glass-alpha) + .1)),rgba(230,244,255,var(--glass-alpha)) 45%,rgba(220,230,255,.05));backdrop-filter:blur(26px) saturate(130%);-webkit-backdrop-filter:blur(26px) saturate(130%);border:1px solid #e5f7ff55;box-shadow:inset 0 1px 0 #fff8,inset 1px 0 0 #fff2,inset 0 -1px 0 #c4dcff22,0 15px 32px #0923372b;color:#fff;text-shadow:0 1px 5px #12294033}
#liquid-desktop .glass:after{content:"";pointer-events:none;position:absolute;inset:0;border-radius:inherit;background:linear-gradient(125deg,#ffffff0d,transparent 35%,transparent 75%,#ffffff0b)}
#liquid-desktop .eyebrow{font-size:10px;font-weight:500;letter-spacing:2px;color:#eff9ffce}
#liquid-desktop .date{font-size:65px;line-height:1.05;letter-spacing:-4px;font-weight:400;margin-top:8px}
#liquid-desktop .month{font-size:12px;color:#edf8ffd4;margin-top:3px}
#liquid-desktop .clock{border-top:1px solid #ffffff24;padding-top:13px;margin-top:16px;font-size:20px;letter-spacing:-.5px}
#liquid-desktop .clock span{font-size:10px;margin-left:4px;color:#ffffffb3;letter-spacing:.3px}
#liquid-desktop .location{display:flex;align-items:center;gap:5px;font-size:12px}
#liquid-desktop .location svg{width:12px;height:12px}
#liquid-desktop .location span{margin-left:auto;font-size:10px;color:#ffffffa0}
#liquid-desktop .temperature{font-size:60px;line-height:1.2;letter-spacing:-3px;margin:12px 0 14px}
#liquid-desktop .weather-bottom{display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.8}
#liquid-desktop .weather-bottom>svg{width:29px;height:29px;flex-shrink:0;stroke-width:1.3}
#liquid-desktop .weather-bottom small{font-size:10px;color:#eefaffbd;white-space:nowrap}
#liquid-desktop .network{grid-column:1/-1;padding:20px 23px 15px}
#liquid-desktop .network-head{display:flex;align-items:center;justify-content:space-between;font-size:13px}
#liquid-desktop .network-head>span:first-child{display:flex;align-items:center;gap:8px}
#liquid-desktop .network-head svg{width:16px;height:16px}
#liquid-desktop .connected{font-size:10px;color:#deffee}
#liquid-desktop .connected:before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#bdedcf;margin-right:5px}
#liquid-desktop .speeds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:19px 0 12px}
#liquid-desktop .speeds small{font-size:10px;color:#edf7ffc4}
#liquid-desktop .speeds strong{display:block;font-size:27px;font-weight:400;letter-spacing:-.9px;margin-top:4px;font-variant-numeric:tabular-nums}
#liquid-desktop .speeds em{font-size:11px;font-style:normal;letter-spacing:0;color:#ffffffa8}
#liquid-desktop .network>svg{display:block;width:100%;height:48px}
#liquid-desktop .chart-labels{display:flex;justify-content:space-between;color:#edf8ff9e;font-size:9px;margin-top:7px}
@media(max-width:620px){#liquid-desktop .caption{display:none}#liquid-desktop .desktop-content{justify-content:center;padding:25px 20px 48px}#liquid-desktop .widgets{width:100%;max-width:370px}#liquid-desktop .topline{font-size:9px;padding:24px 20px}#liquid-desktop .glass{padding:17px}#liquid-desktop .network{padding:20px}#liquid-desktop .weather-bottom{gap:5px}}
</style>
<script>
(()=>{const root=document.getElementById('liquid-desktop');const state={radius:28,frost:13};const render=()=>{root.style.setProperty('--glass-radius',state.radius+'px');root.style.setProperty('--glass-alpha',state.frost/100)};render();if(globalThis.Tweak){const controls=new Tweak({container:root,onChange:render});controls.addSlider(state,'radius',{label:'모서리 곡률',min:16,max:40,unit:'px'});controls.addSlider(state,'frost',{label:'유리 불투명도',min:6,max:30,unit:'%'});}})();
</script>
