<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시계, 네 가지 — Liquid Widgets</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11151c;color:#eef0f5;font:15px/1.6 system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:40px 28px 100px}.eyebrow{font-size:11px;letter-spacing:3px;color:#b1b7c7}h1{font-size:34px;letter-spacing:-1.4px;margin:7px 0 9px;font-weight:600}.intro{color:#a8b1c0;margin:0 0 24px;max-width:720px}.controls{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px}nav,.themes{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:13px;cursor:pointer;background:#1b222d;color:#bdc5d4;border:1px solid #30394a;border-radius:10px;padding:9px 13px;transition:background .15s}button:hover{background:#2a3548}button[aria-pressed=true]{background:#e5eaf4;border-color:#e5eaf4;color:#182033}button:focus-visible,a:focus-visible{outline:2px solid #b5caff;outline-offset:4px}figure{margin:0;border:1px solid #30394a;border-radius:16px;overflow:hidden;background:#1b222d}figure a{display:block}img{display:block;width:100%;height:auto;aspect-ratio:1.6}figcaption{padding:16px 20px;display:flex;justify-content:space-between;gap:20px;align-items:baseline}.caption-title{font-size:17px;font-weight:600}.caption-detail{color:#aeb8c9;font-size:13px}.note{color:#7f8da2;font-size:12px;margin-top:14px}.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#101722ed;border:1px solid #3d4a60;border-radius:50px;padding:7px 9px;box-shadow:0 8px 30px #0005;backdrop-filter:blur(15px)}.switcher button{border:0;border-radius:50%;width:38px;height:38px;padding:0;font-size:18px}.switcher span{min-width:165px;text-align:center;font-size:13px;color:#e2e8f5}@media(max-width:700px){main{padding:24px 14px 100px}h1{font-size:28px}figcaption{display:block;padding:12px}.caption-detail{margin-top:4px}button{padding:8px 10px}.intro{font-size:13px}.controls{gap:10px}}
</style>
<main>
 <div class="eyebrow">LIQUID WIDGETS · CLOCK STUDIES</div>
 <h1>시계, 네 가지.</h1>
 <p class="intro">같은 크기의 유리 카드에 네 가지 시계를 담았어. 전체 비교를 보고, 각 시안을 눌러 날씨·달력 옆에 놓였을 때의 모습을 확인해 봐.</p>
 <div class="controls">
  <nav aria-label="시계 시안">
   <button data-variant="0">전체 비교</button>
   <button data-variant="1">1 · 큰 디지털</button>
   <button data-variant="2">2 · 사각 눈금</button>
   <button data-variant="3">3 · 클래식 원형</button>
   <button data-variant="4">4 · 미니멀</button>
  </nav>
  <div class="themes" aria-label="화면 모드"><button data-theme="dark">다크</button><button data-theme="light">라이트</button></div>
 </div>
 <figure>
  <a id="original" target="_blank" rel="noopener" title="원본 크기로 보기"><img id="preview" alt="시계 시안의 실제 GNOME 화면"></a>
  <figcaption><div class="caption-title" id="title"></div><div class="caption-detail" id="detail"></div></figcaption>
 </figure>
 <p class="note">실제 GNOME에서 캡처한 디자인 시안 · 날씨와 같은 232 × 230 크기 · 비교용 시간과 데이터 · 이미지를 누르면 원본을 볼 수 있어.</p>
</main>
<div class="switcher" aria-label="시안 전환"><button id="prev" aria-label="이전 시안">←</button><span id="current" aria-live="polite"></span><button id="next" aria-label="다음 시안">→</button></div>
<script>
const names=['전체 비교','큰 디지털','사각 눈금','클래식 원형','미니멀 아날로그'];
const descriptions=['크기와 시간을 맞춰 디자인만 비교','큰 숫자와 가장자리 눈금으로 채운 시계','사각형의 모서리까지 활용한 아날로그','숫자와 원형 다이얼이 있는 익숙한 시계','눈금과 바늘만 남긴 간결한 시계'];
let variant=0,theme='dark';
function read(){const q=new URLSearchParams(location.search);variant=Math.min(4,Math.max(0,Number(q.get('variant'))||0));theme=q.get('theme')==='light'?'light':'dark';}
function render(){
 const src=variant===0?`clock-comparison-${theme}.png`:`clock-${variant}-${theme}.png`;
 document.querySelector('#preview').src=src;document.querySelector('#preview').alt=`${names[variant]} · ${theme==='dark'?'다크':'라이트'} 실제 GNOME 화면`;
 document.querySelector('#original').href=src;document.querySelector('#title').textContent=(variant?`${variant}. `:'')+names[variant];
 document.querySelector('#detail').textContent=descriptions[variant];document.querySelector('#current').textContent=`${names[variant]} · ${theme==='dark'?'다크':'라이트'}`;
 for(const b of document.querySelectorAll('[data-variant]'))b.setAttribute('aria-pressed',String(Number(b.dataset.variant)===variant));
 for(const b of document.querySelectorAll('[data-theme]'))b.setAttribute('aria-pressed',String(b.dataset.theme===theme));
}
function update(){const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('theme',theme);history.replaceState(null,'',url);render();}
function cycle(delta){variant=(variant+delta+5)%5;update();}
for(const b of document.querySelectorAll('[data-variant]'))b.onclick=()=>{variant=Number(b.dataset.variant);update();};
for(const b of document.querySelectorAll('[data-theme]'))b.onclick=()=>{theme=b.dataset.theme;update();};
document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);
addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1);}});
addEventListener('popstate',()=>{read();render();});read();render();
</script>
</html>
