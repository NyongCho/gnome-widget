[package]
name = "liquid-widgets-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures-util = "0.3.34"
jsonschema = { version = "0.60.2", default-features = false }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
