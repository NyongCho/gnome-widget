[package]
name = "liquid-widgets-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures-util = "0.3.34"
jsonschema = { version = "0.60.2", default-features = false }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
tempfile = "3.27.0"
