[package]
name = "liquid-widgets-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
jsonschema = { version = "0.60.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lib]
path = "src/lib.rs"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
